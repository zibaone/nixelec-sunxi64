# Veille : le noyau doit rester maitre du watchdog et du recepteur IR
# pendant s2idle.  Les deux patchs portent sur l'arbre 7.0.14
# (drivers/watchdog/sunxi_wdt.c, drivers/media/rc/sunxi-cir.c) et sont
# independants du jeu Armbian.
#
# 0001 : le compteur est dans le domaine toujours alimente et ne peut pas
# etre nourri pendant s2idle.  watchdog_core ne stoppe pas le materiel (son
# notateur pinge une fois puis annule son worker), donc le pilote arrete le
# compteur depuis un notateur PM_SUSPEND_PREPARE et le reprogramme en
# PM_POST_SUSPEND.  Le bit WDOG_NO_PING_ON_SUSPEND doit etre pose AVANT
# l'enregistrement du watchdog : le noyau n'enregistre son notateur PM (qui
# annule le hrtimer keepalive/pretimeout) que si le bit est present a ce
# moment-la.  Mesure du 2026-11-26 sur H96 Max H618 :
#  - sans correctif, 90 s de veille = reboot a 16 s, 8 s = reprise OK ;
#  - arret depuis ->suspend() : une veille de 60 s armee par rtcwake ne
#    revient jamais (l'alarme RTC, seule source, n'est plus delivree) ;
#  - bit pose apres l'enregistrement : panic "watchdog pretimeout event" en
#    s2idle, le hrtimer du coeur n'etant pas annule ;
#  - arret avant la phase dpm (watchdog ferme par systemd), meme veille de
#    60 s : reprise propre (PM: suspend exit).  Revalider sur carte.
# 0002 : reveil par l'IR.  Le bloc IR H616 est sur r_ccu (domaine toujours
# alimente) : quand le reveil est arme, on garde les horloges et le reset
# actifs en veille au lieu de couper le bloc dans sunxi_ir_hw_exit().
0001-watchdog-sunxi-stop-on-suspend.patch
0002-media-rc-sunxi-cir-wake-on-ir.patch
