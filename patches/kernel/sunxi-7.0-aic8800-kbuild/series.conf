# Accroche kbuild du pilote AIC8800 SDIO.
#
# Le patch Armbian 3401 (archive/sunxi-7.0/patches.armbian) ajoute les 136
# fichiers de drivers/net/wireless/aic8800_sdio/ mais ne touche ni le Kconfig ni
# le Makefile de drivers/net/wireless/ : kbuild ne descend jamais dans le
# répertoire, aucun .ko n'est produit, et CONFIG_AIC_SDIO_WLAN_SUPPORT=y de la
# config de famille ne sert à rien.
#
# Ce répertoire est possédé par nixbian (platform_patches.json) : il s'applique
# APRÈS le jeu Armbian, donc après 3401, et survit à `just refresh-metadata`.
0001-net-wireless-wire-aic8800-sdio-into-kbuild.patch
