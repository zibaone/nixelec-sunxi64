# Wake-on-LAN (magic packet) sur l'Ethernet interne des H616/H618.
#
# CIBLE : le module hors arbre `sunxi-gmac` (packages/sunxi-gmac/src), PAS
# l'arbre noyau.  Les chemins des patchs sont donc `a/sunxi-gmac.c` et
# `b/sunxi-gmac.c`.
#
# Pourquoi cette cible et pas dwmac-sun8i : sur la H96 Max H618, eth0 est
# piloté par le module vendor (`allwinner,sunxi-gmac`, voir le DTS
# patches/kernel/sunxi-7.0-h96-max/0001).  La variante mainline
# (`allwinner,sun50i-h616-emac1`, patches/kernel/0002 et 0003) ne reçoit
# aucune trame sur ces boîtiers — mesuré, voir docs/etude-portage-sunxi-gmac.md.
# Un patch sur drivers/net/ethernet/stmicro/stmmac/dwmac-sun8i.c serait inerte
# ici : le driver n'est jamais lié à ethernet@5030000.
#
# Application :
#   - par le build : `patches = [ ... ]` dans packages/sunxi-gmac/default.nix ;
#   - à la main, dans une copie inscriptible de la source du module :
#       cp -a packages/sunxi-gmac/src /tmp/gmac && cd /tmp/gmac
#       for p in <repo>/packages/sunxi-gmac/patches/*.patch; do
#           patch -p1 < "$p" || break
#       done
#     L'ordre compte : 0002 modifie des lignes ajoutées par 0001.
#
# Ce que le matériel permet réellement (sources dans docs/wol-h96.md) :
#   - le GMAC Allwinner n'a pas de bloc PMT/magic-packet documenté : la carte
#     des registres du vendor s'arrête à SUNXI_GMAC_RGMII_STA (0xD0) et 0x2C
#     (GMAC_PMT du coeur DesignWare dwmac1000) tombe dans un trou non
#     documenté, entre RX_CTL1 (0x28) et RX_DESC_LIST (0x34) ;
#   - le seul événement de réveil que ce MAC sait produire est son IRQ RX
#     (GIC SPI 15), levée pour toute trame acceptée par le filtre d'adresses ;
#   - s2idle ne coupe ni la SoC ni ses domaines d'alimentation : garder le MAC
#     cadencé, le ring DMA armé et le PHY alimenté suffit pour qu'une trame
#     reçue réveille la boîte ;
#   - aucun patch du driver PHY AC300 n'est nécessaire : phylib ne suspend pas
#     un PHY dont le netdev peut réveiller (drivers/net/phy/phy_device.c,
#     mdio_bus_phy_may_suspend()) et le driver pose `mac_managed_pm` à l'open,
#     ce qui court-circuite mdio_bus_phy_suspend().
#
# Aucun patch DTS : le driver ne lit pas `wakeup-source`, et
# /sys/class/net/<if>/device/power/wakeup est créé par
# device_set_wakeup_capable() au probe (patch 0001).
#
# Limites assumées, à trancher sur silicium (docs/wol-h96.md §5) :
#   - pas de filtrage magic packet : toute trame adressée à la MAC ou
#     diffusée réveille la boîte ;
#   - réveil depuis s2idle seulement : l'AXP1530 coupe les rails en poweroff,
#     et le mainline n'a pas de suspend-to-RAM pour cette famille ;
#   - l'horloge 24 MHz du PHY vient de PWM5 (pwm-sunxi-enhance) : rien ne la
#     coupe en s2idle dans le code connu, mais ce n'est pas mesuré.
0001-net-sunxi-gmac-add-wake-on-lan-ethtool-callbacks.patch
0002-net-sunxi-gmac-keep-mac-and-phy-alive-in-s2idle.patch
