# Télécommande multi-télécommandes (scancodes 24 bits) — profil « multi ».
#
# Un fichier = une télécommande : le noyau n'étend dev->keybit que pour
# les keycodes réellement écrits, et un fichier multi-profils laisse des
# touches hors keybit (mesuré le 27/10, voir specs/ir-receiver-zero3.md §2.0).
# variant = "necx" : encodage des scancodes (30 entrées).
[[protocols]]
name = "multi"
protocol = "nec"
variant = "necx"

[protocols.scancodes]
0x40404d = "KEY_POWER"
0x404043 = "KEY_MUTE"
0x40401c = "KEY_VOLUMEDOWN"
0x404015 = "KEY_VOLUMEUP"
0x40400b = "KEY_UP"
0x404010 = "KEY_LEFT"
0x404011 = "KEY_RIGHT"
0x40400e = "KEY_DOWN"
0x40400d = "KEY_OK"
0x40401a = "KEY_HOME"
0x404045 = "KEY_MENU"
0x404042 = "KEY_BACK"
0x404001 = "KEY_1"
0x404002 = "KEY_2"
0x404003 = "KEY_3"
0x404004 = "KEY_4"
0x404005 = "KEY_5"
0x404006 = "KEY_6"
0x404007 = "KEY_7"
0x404008 = "KEY_8"
0x404009 = "KEY_9"
0x404047 = "KEY_SUBTITLE"
0x404000 = "KEY_0"
0x40400c = "KEY_DELETE"
0x404053 = "KEY_RED"
0x40405b = "KEY_GREEN"
0x404057 = "KEY_YELLOW"
0x404054 = "KEY_BLUE"
0x40401e = "KEY_PREVIOUS"
0x40401f = "KEY_NEXT"
